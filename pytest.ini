[pytest]
# https://docs.pytest.org/en/7.1.x/how-to/doctest.html#using-doctest-options
doctest_optionflags = NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL
# Alternatively, options can be enabled by an inline comment in the doc test itself:
# >>> something_that_raises()  # doctest: +IGNORE_EXCEPTION_DETAIL
# Traceback (most recent call last):
# ValueError: ...
# rkvst.py imports the unpublished `archivist` client (ADR 0004) and
# policy_engine.py imports optional heavy dependencies, so neither can be
# imported in CI; exclude them from doctest collection.
addopts = --doctest-modules --ignore=scitt_emulator/rkvst.py --ignore=scitt_emulator/policy_engine.py
