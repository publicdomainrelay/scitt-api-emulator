name: Publish Test Report

on:
  push:
    branches:
      - main

jobs:
  publish-test-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install API Emulator
      run: pip install -e .[oidc]

    - name: Run API Emulator
      # --error-rate 0: the default 0.01 injects random 503s, which would
      # make the Postman sanity collection flaky.
      run: scitt-emulator server --workspace workspace/ --tree-alg RFC9162_SHA256 --error-rate 0 &

    - name: Wait for server
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://127.0.0.1:8000/.well-known/scitt-keys > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "server did not become ready"
        exit 1

    - name: Install Postman
      run: npm install -g newman newman-reporter-htmlextra

    - name: Run Postman Test Report
      run: ./run-sanity.sh
      working-directory: ./postman

    - name: Publish to GitHub Pages 🚀
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs
  
  
  
